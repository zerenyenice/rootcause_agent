[project]
name = "rootcause"
version = "0.1.0"
description = "RootCause: root-cause analysis agents over manufacturing data (API, agents, connections, database, evals)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # settings, logging, telemetry
    "pydantic-settings>=2.6",
    "structlog>=24",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    # service clients (rootcause.clients)
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "httpx>=0.27",
    # Exact pin: the client patches two private SDK internals
    # (CallbackHandler._get_error_level_and_status_message and
    # langfuse._client.propagation._detach_context_token_safely); bump deliberately
    # and re-run test_langfuse_pii_hardening.py, which checks both still exist.
    "langfuse==5.0.4",
    # database (rootcause.db) and connections
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "sqlglot>=30.24,<31",
    # API (rootcause.api)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "limits>=3.13,<6",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # agents (rootcause.agents)
    "deepagents>=0.7",
    "langchain>=1.0",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    # eval harness (rootcause.evals)
    "numpy>=2",
    "pandas>=3.0",
    "duckdb>=1.1",
    "pyarrow>=17",
]

[project.scripts]
rootcause-db = "rootcause.db.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootcause"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "pandas-stubs>=3.0",
    "pytest-postgresql>=6",
    "psycopg[binary]>=3.2",
    # Python SAST for the `security-sast` CI job (exact version pinned in uv.lock).
    "bandit>=1.9.4,<2",
    "blockbuster==1.5.29",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "src"]
# Pre-existing template/harness tooling, not part of the product codebase.
extend-exclude = [".claude", "setup-harness.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# RED tests import modules that do not exist yet; without this ruff
# classifies them as third-party and the GREEN commit fails I001.
known-first-party = ["rootcause"]

[tool.bandit]
# Python SAST for the `security-sast` CI job: `uv run bandit -c pyproject.toml -r src -ll`
# (-ll = fail on medium severity and above). No global `skips`/`exclude_dirs` on purpose:
# a false positive is suppressed only at its line with `# nosec B<id>` plus a one-line
# reason comment, so every exception stays visible and reviewable in the diff.
skips = []

[tool.mypy]
python_version = "3.12"
strict = true
# Teaches mypy pydantic's synthesized __init__ (BaseSettings fields are
# optional kwargs because they are populated from the environment).
plugins = ["pydantic.mypy"]
# tests/ has no __init__.py and several areas share basenames (test_smoke.py,
# conftest.py), so mypy needs explicit package bases to give them distinct module
# names (tests.core.test_smoke etc.); src/ is a base so the library keeps its
# real name (rootcause).
explicit_package_bases = true
mypy_path = ["src"]
files = ["src", "tests"]

# Tests are checked with relaxed rules: fixtures and test functions may omit
# annotations, but their bodies are still checked.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets every test area keep its own test_smoke.py/conftest.py
# without basename collisions; the --cov flags enforce the 80% gate from the rules.
addopts = "--import-mode=importlib --cov --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: fast isolated tests",
    "integration: tests touching services",
    "e2e: end-to-end flows",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
