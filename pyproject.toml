[project]
name = "rootcause-workspace"
version = "0.1.0"
description = "uv workspace root for the RootCause monorepo (apps/ and packages/)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1", "pytest-cov>=7.1", "ruff>=0.17", "mypy>=2.4", "pandas-stubs>=3.0"]
# Workspace members are installed editable by `uv sync` through this default
# group so the root project itself carries no runtime dependencies.
workspace = [
    "rootcause-api",
    "rootcause-core",
    "rootcause-agents",
    "rootcause-tools",
    "rootcause-catalog",
    "rootcause-connections",
    "rootcause-anomaly",
    "rootcause-memory",
    "rootcause-evals",
]

[tool.uv]
package = false
default-groups = ["dev", "workspace"]

[tool.uv.workspace]
members = ["apps/api", "packages/*"]

[tool.uv.sources]
rootcause-api = { workspace = true }
rootcause-core = { workspace = true }
rootcause-agents = { workspace = true }
rootcause-tools = { workspace = true }
rootcause-catalog = { workspace = true }
rootcause-connections = { workspace = true }
rootcause-anomaly = { workspace = true }
rootcause-memory = { workspace = true }
rootcause-evals = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Workspace src/ trees so isort classifies rootcause_* imports as first-party.
src = [".", "apps/api/src", "packages/*/src"]
# Pre-existing template/harness tooling, not part of the product codebase.
extend-exclude = [".claude", "setup-harness.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# Teaches mypy pydantic's synthesized __init__ (BaseSettings fields are
# optional kwargs because they are populated from the environment).
plugins = ["pydantic.mypy"]
# Every tests/ dir has a test_smoke.py and no __init__.py, so mypy needs explicit
# package bases to give them distinct module names (packages.core.tests.test_smoke
# etc.). The src/ roots are listed as bases so library modules keep their real
# names (rootcause_core, ...); mypy_path does not expand globs, hence the list.
explicit_package_bases = true
mypy_path = [
    "apps/api/src",
    "packages/agents/src",
    "packages/anomaly/src",
    "packages/catalog/src",
    "packages/connections/src",
    "packages/core/src",
    "packages/evals/src",
    "packages/memory/src",
    "packages/tools/src",
]
files = ["apps/api/src", "packages/*/src", "tests", "apps/api/tests", "packages/*/tests"]

# Tests are checked with relaxed rules: fixtures and test functions may omit
# annotations, but their bodies are still checked.
[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "apps", "packages"]
# importlib mode lets every package keep its own tests/test_smoke.py without
# basename collisions; the --cov flags enforce the 80% gate from the rules.
addopts = "--import-mode=importlib --cov --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: fast isolated tests",
    "integration: tests touching services",
    "e2e: end-to-end flows",
]

[tool.coverage.run]
source = ["apps", "packages"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
