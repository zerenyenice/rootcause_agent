# RootCause local stack: the stateful services (T002) plus the MVP application
# services web, api, agent and migrate (docs/plans/MVP.md). Owner: devops.
#
# Quick start (from the repo root):
#   cp deploy/.env.example deploy/.env      # then replace every placeholder
#   docker compose -f deploy/docker-compose.yml up -d --build
# Compose reads deploy/.env automatically (the project directory is the
# directory of this file). See deploy/README.md for verify/reset steps.
#
# Conventions:
#   - exact image tags, never `latest`; bump via a deliberate `chore(deploy):`
#     commit (observed manifest digests are recorded next to each image)
#   - every published port binds to 127.0.0.1 only
#   - no secret lives in this file or in any tracked file; values come from
#     deploy/.env (gitignored) and the `:?` required-variable markers make
#     the stack refuse to start without them
#   - exception: the optional Langfuse server (profile `observability`) reads
#     its secrets from deploy/langfuse.env (gitignored, optional) via
#     `env_file:`, so the base stack needs nothing Langfuse-specific in
#     deploy/.env; without that file the Langfuse services fail at their own
#     start, not at `compose config`
#   - `restart: unless-stopped` + healthchecks on every long-running service
#   - the application services (web, api, agent, migrate) have NO
#     authentication in the MVP: they are for a single trusted user on this
#     host, which is why their ports bind to 127.0.0.1 only

name: rootcause

# Langfuse server secrets (observability profile) come from this optional file,
# NOT from `${VAR:?}` interpolation: interpolation covers the whole compose
# file whatever the active profile, which would force them into deploy/.env
# for a plain `docker compose up`. See deploy/langfuse.env.example. Keys set
# under `environment:` override the file, so secrets must not appear there.
x-langfuse-env-file: &langfuse-env-file
  - path: ./langfuse.env
    required: false

# Non-secret environment shared by langfuse-web and langfuse-worker
# (DATABASE_URL, SALT, ENCRYPTION_KEY, CLICKHOUSE_PASSWORD, REDIS_AUTH and the
# S3 secret keys come from deploy/langfuse.env).
x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3001}
  # No usage telemetry to Langfuse GmbH from a self-hosted install.
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

# Healthy-dependency set shared by langfuse-web and langfuse-worker.
x-langfuse-depends-on: &langfuse-depends-on
  langfuse-postgres:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy

# ---------------------------------------------------------------------------
# Shared pieces of the application services (api, agent, migrate).
# ---------------------------------------------------------------------------
# One image for api, agent and migrate (repo-root Dockerfile).
x-app-build: &app-build
  context: ..
  dockerfile: Dockerfile

# ROOTCAUSE_* settings come from deploy/.env (the same file compose reads for
# interpolation). `required: false` only so `docker compose config` works
# without it (CI); `up` cannot get that far without deploy/.env anyway, the
# `${VAR:?}` markers below need it.
x-app-env-file: &app-env-file
  - path: ./.env
    required: false

# Container-side overrides. deploy/.env is written for a host-run API
# (localhost URLs); inside the compose network the hosts differ, so these
# keys replace the file's values (`environment:` wins over `env_file:`).
x-app-environment: &app-environment
  # Runtime role only (docs/adr/0007); never the superuser.
  ROOTCAUSE_DATABASE_URL: postgresql://rootcause_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-rootcause}
  ROOTCAUSE_OPENVIKING_URL: http://openviking:1933
  # Langfuse as seen from the containers: the compose service when the
  # `observability`/`langfuse` profile runs, or set CONTAINER_LANGFUSE_HOST
  # (e.g. https://cloud.langfuse.com) in deploy/.env. Only used when
  # ROOTCAUSE_LANGFUSE_ENABLED=true.
  ROOTCAUSE_LANGFUSE_HOST: ${CONTAINER_LANGFUSE_HOST:-http://langfuse-web:3000}
  # Legacy single-warehouse setting, as a container path under the /data
  # mount (e.g. /data/warehouse/warehouse.duckdb). Empty = unset (a host path
  # from deploy/.env would not exist in the container).
  ROOTCAUSE_WAREHOUSE_PATH: ${CONTAINER_WAREHOUSE_PATH:-}

# Least privilege: deploy/.env also holds the stack's own secrets. Blank the
# ones the application must not see (empty values are ignored by
# rootcause.settings, so blanking = unset). The migrator URL is re-added on
# the migrate service only.
x-app-env-scrub: &app-env-scrub
  ROOTCAUSE_MIGRATION_DATABASE_URL: ""
  ROOTCAUSE_ADMIN_DATABASE_URL: ""
  POSTGRES_PASSWORD: ""
  POSTGRES_MIGRATOR_PASSWORD: ""
  POSTGRES_APP_PASSWORD: ""
  OPENVIKING_ROOT_API_KEY: ""
  OPENVIKING_EMBEDDING_API_KEY: ""
  OPENVIKING_VLM_API_KEY: ""

# api and agent start only after the schema is at head.
x-app-depends-on: &app-depends-on
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

# Demo data: the host's <repo>/data (gitignored) read-only at /data, so a
# generated DuckDB warehouse can be registered as a connection with the path
# /data/warehouse/warehouse.duckdb (deploy/README.md "Demo warehouse").
x-app-data-volume: &app-data-volume
  - ${DATA_DIR:-../data}:/data:ro

services:
  # ---------------------------------------------------------------------------
  # Postgres 16 + pgvector (ADR-0003: catalog, audit log, app state, LangGraph
  # checkpointer/store all live here; hybrid search via pgvector).
  # Image: the pgvector project's official build on top of the official
  # postgres image. 0.8.7-pg16 = pgvector 0.8.7 on PostgreSQL 16 (Debian
  # bookworm). Multi-arch index digest observed 2026-10-25:
  #   sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      # Only the POSTGRES_* subset of deploy/.env is handed to this container
      # (no `env_file:` on purpose: the OpenViking provider keys must not leak
      # into the database container's environment).
      POSTGRES_USER: ${POSTGRES_USER:-rootcause}
      POSTGRES_DB: ${POSTGRES_DB:-rootcause}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # Read by postgres/init.sql (psql \getenv) for the migrator and runtime
      # roles it creates on the first start (docs/adr/0007).
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD in deploy/.env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on first start against an empty volume: the three roles,
      # CREATE EXTENSION vector, schemas app/catalog/audit owned by
      # rootcause_owner and the runtime grants. `down -v` to re-run.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-rootcause-init.sql:ro
    healthcheck:
      # $$ defers expansion to the container shell, where POSTGRES_* are set.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # OpenViking server (ADR-0003: agent memory, lessons and skills; run
  # unmodified as a separate AGPLv3 service, only its client is used from our
  # code). PROJECT.md section 6 and ADR-0003 pin the 0.3.x line; v0.3.24
  # (2026-06-05) is the last 0.3.x release.
  # Official image: ghcr.io/volcengine/openviking, published by the upstream
  # build-docker-image.yml workflow (docs/en/guides/03-deployment.md "Docker").
  # Mirrors: docker.io/openviking/openviking and
  # openviking-cn-beijing.cr.volces.com/volcengine/openviking.
  # Multi-arch index digest observed 2026-10-25:
  #   sha256:07b01246fda12ca9ca6b5d7e21add2d2d2d9673da805ca4f09ec8d026a878dc7
  # Server port 1933; GET /health is the unauthenticated liveness probe
  # ({"status": "ok"}), GET /ready additionally checks the embedding provider.
  # ---------------------------------------------------------------------------
  openviking:
    image: ghcr.io/volcengine/openviking:v0.3.24
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENVIKING_PORT:-1933}:1933"
    volumes:
      # All persistent state (workspace data, API-key index) under one mount;
      # ov.conf is NOT in here, see the template mount below.
      - openviking_data:/app/.openviking
      # Secret-free template; the server expands ${VAR} references from this
      # container's environment at load time (see deploy/openviking/ov.conf).
      # Kept outside the data volume so config edits apply on the next
      # restart instead of being frozen by the first start.
      - ./openviking/ov.conf:/etc/openviking/ov.conf:ro
    environment:
      OPENVIKING_CONFIG_FILE: /etc/openviking/ov.conf
      # VikingBot (the agent framework bundled with the image) is not part of
      # this stack; only the context-database server is wanted.
      OPENVIKING_WITH_BOT: "0"
      # Required because the server binds 0.0.0.0 inside the container
      # (upstream refuses to start without it); selects `api_key` auth mode.
      OPENVIKING_ROOT_API_KEY: ${OPENVIKING_ROOT_API_KEY:?set OPENVIKING_ROOT_API_KEY in deploy/.env}
      # Embedding provider (PRD: OpenAI-compatible by default, Ollama for
      # air-gapped installs). Provider ids and model/dimension pairs:
      # https://github.com/volcengine/OpenViking/blob/v0.3.24/docs/en/guides/01-configuration.md#embedding
      OPENVIKING_EMBEDDING_PROVIDER: ${OPENVIKING_EMBEDDING_PROVIDER:-openai}
      OPENVIKING_EMBEDDING_API_BASE: ${OPENVIKING_EMBEDDING_API_BASE:-https://api.openai.com/v1}
      OPENVIKING_EMBEDDING_API_KEY: ${OPENVIKING_EMBEDDING_API_KEY:?set OPENVIKING_EMBEDDING_API_KEY in deploy/.env}
      OPENVIKING_EMBEDDING_MODEL: ${OPENVIKING_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENVIKING_EMBEDDING_DIMENSION: ${OPENVIKING_EMBEDDING_DIMENSION:-1536}
      # VLM used by OpenViking for L0/L1 summary generation. Defaults to the
      # same provider/key as embeddings.
      OPENVIKING_VLM_PROVIDER: ${OPENVIKING_VLM_PROVIDER:-${OPENVIKING_EMBEDDING_PROVIDER:-openai}}
      OPENVIKING_VLM_API_BASE: ${OPENVIKING_VLM_API_BASE:-${OPENVIKING_EMBEDDING_API_BASE:-https://api.openai.com/v1}}
      OPENVIKING_VLM_API_KEY: ${OPENVIKING_VLM_API_KEY:-${OPENVIKING_EMBEDDING_API_KEY}}
      OPENVIKING_VLM_MODEL: ${OPENVIKING_VLM_MODEL:?set OPENVIKING_VLM_MODEL in deploy/.env}
    healthcheck:
      # curl ships in the upstream runtime image (it is what the upstream
      # HEALTHCHECK uses too). /health needs no API key.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1933/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Self-hosted Langfuse (T009, ADR-0006): agent traces and prompt management.
  # Optional profile `observability` (alias `langfuse`); a plain
  # `docker compose up` does not start it:
  #   docker compose -f deploy/docker-compose.yml --profile observability up -d
  # Layout follows the upstream single-host compose file
  # (https://github.com/langfuse/langfuse/blob/v4.70.0/docker-compose.yml):
  # web + worker, Postgres (dedicated, not the RootCause database), ClickHouse,
  # Redis and MinIO. Server v4 is required: the Python SDK 5.x pinned in
  # pyproject.toml supports self-hosted Langfuse v4.59.0+ only (v3 is not
  # supported). Only the UI/API and MinIO's S3 port are published, on
  # 127.0.0.1. Digests observed 2026-10-25 are recorded next to each image.
  # Secrets: deploy/langfuse.env (copy deploy/langfuse.env.example). Postgres,
  # web and worker reject a missing secret themselves; ClickHouse, Redis and
  # MinIO would start without one, so their start command checks it first and
  # also refuses the `change-me` placeholders copied from the example file.
  # ---------------------------------------------------------------------------
  # sha256:932a46dfab770f89ecb2ec35258b6b80d3be8773403981a64d271ff0a408deef
  langfuse-web:
    image: langfuse/langfuse:4.70.0
    profiles: [observability, langfuse]
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      # Host port 3001 by default: 3000 belongs to the RootCause web service.
      - "127.0.0.1:${LANGFUSE_PORT:-3001}:3000"
    # NEXTAUTH_SECRET and the optional LANGFUSE_INIT_ORG_ID, _PROJECT_ID,
    # _USER_EMAIL and _USER_PASSWORD also come from deploy/langfuse.env.
    env_file: *langfuse-env-file
    environment:
      <<: *langfuse-env
      # Browsers and SDKs upload media through the published MinIO port; the
      # server itself talks to MinIO inside the network.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${LANGFUSE_MINIO_PORT:-9090}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      # Optional headless first-start setup; it runs only when
      # LANGFUSE_INIT_ORG_ID (deploy/langfuse.env) is set. The project's API
      # keys (public and secret) also come from deploy/langfuse.env, so no
      # secret is interpolated into this file.
      LANGFUSE_INIT_ORG_NAME: RootCause
      LANGFUSE_INIT_PROJECT_NAME: rootcause
      LANGFUSE_INIT_USER_NAME: admin
    healthcheck:
      # The runtime image has no curl/wget; Next.js binds to the container
      # hostname, so probe that rather than 127.0.0.1.
      test: ["CMD", "node", "-e", "fetch('http://'+require('os').hostname()+':3000/api/public/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # sha256:3b3b204fa72fd02d010ab90c667d07281e4b9ec3b5b0b1d21470ac2624b8a564
  langfuse-worker:
    image: langfuse/langfuse-worker:4.70.0
    profiles: [observability, langfuse]
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    env_file: *langfuse-env-file
    environment:
      <<: *langfuse-env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://'+require('os').hostname()+':3030/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Dedicated Postgres for Langfuse metadata; keeps trace tooling out of the
  # RootCause database. Not published on the host.
  # sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
  langfuse-postgres:
    image: postgres:17.11
    profiles: [observability, langfuse]
    restart: unless-stopped
    # POSTGRES_PASSWORD from deploy/langfuse.env; the image refuses to
    # initialise without it.
    env_file: *langfuse-env-file
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 12

  # sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12.11
    profiles: [observability, langfuse]
    restart: unless-stopped
    user: "101:101"
    # CLICKHOUSE_PASSWORD from deploy/langfuse.env. The image would create the
    # user without a password, so refuse to start instead, then hand over to
    # the image's own entrypoint.
    entrypoint: ["sh", "-c", ": \"$${CLICKHOUSE_PASSWORD:?is not set: create deploy/langfuse.env from deploy/langfuse.env.example}\" && case \"$$CLICKHOUSE_PASSWORD\" in change-me*) echo 'CLICKHOUSE_PASSWORD is still the placeholder: replace it in deploy/langfuse.env' >&2; exit 1;; esac && exec /entrypoint.sh"]
    env_file: *langfuse-env-file
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  # sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
  langfuse-redis:
    image: redis:7.4.11
    profiles: [observability, langfuse]
    restart: unless-stopped
    # Runs as the image's unprivileged `redis` user (uid/gid 999), which owns
    # /data in the image, so the entrypoint never needs root to chown it.
    user: "999:999"
    # Langfuse's queues need noeviction. REDIS_AUTH (the variable Langfuse
    # reads) from deploy/langfuse.env; an empty --requirepass would disable
    # auth, so refuse to start without it (or with the example placeholder).
    command: ["sh", "-c", ": \"$${REDIS_AUTH:?is not set: create deploy/langfuse.env from deploy/langfuse.env.example}\" && case \"$$REDIS_AUTH\" in change-me*) echo 'REDIS_AUTH is still the placeholder: replace it in deploy/langfuse.env' >&2; exit 1;; esac && exec redis-server --requirepass \"$$REDIS_AUTH\" --maxmemory-policy noeviction"]
    env_file: *langfuse-env-file
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Upstream's MinIO build (Chainguard publishes only `latest` publicly, so it
  # is pinned by digest). The `langfuse` bucket is created before start.
  langfuse-minio:
    image: cgr.dev/chainguard/minio:latest@sha256:87896cb33f93ecfcca4e883c3fb2f86a0a1a600c003a104011ed30631c1869c3
    profiles: [observability, langfuse]
    restart: unless-stopped
    entrypoint: sh
    # MINIO_ROOT_PASSWORD from deploy/langfuse.env; checked (set, and not the
    # example placeholder) before start.
    command: ["-c", ": \"$${MINIO_ROOT_PASSWORD:?is not set: create deploy/langfuse.env from deploy/langfuse.env.example}\" && case \"$$MINIO_ROOT_PASSWORD\" in change-me*) echo 'MINIO_ROOT_PASSWORD is still the placeholder: replace it in deploy/langfuse.env' >&2; exit 1;; esac && mkdir -p /data/langfuse && exec minio server --address :9000 --console-address :9001 /data"]
    env_file: *langfuse-env-file
    environment:
      MINIO_ROOT_USER: minio
    ports:
      - "127.0.0.1:${LANGFUSE_MINIO_PORT:-9090}:9000"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------------------
  # Application services (docs/plans/MVP.md "Services"). Started by a plain
  # `docker compose up`, no profile. api, agent and migrate share ONE image
  # built from the repo root (Dockerfile, uv sync --locked --no-dev) with
  # different commands; web is built from web/.
  #
  #   migrate  one-shot `rootcause-db upgrade` as the migrator role, after
  #            postgres is healthy; api and agent wait for it to succeed
  #   api      FastAPI backend for the UI           127.0.0.1:${API_PORT:-8000}
  #   agent    deep-agent service (threads, runs)   127.0.0.1:${AGENT_PORT:-8100}
  #   web      Next.js UI                           127.0.0.1:${WEB_PORT:-3000}
  #
  # No authentication in the MVP (auth is a `later` item): every port binds
  # to 127.0.0.1 only. Do not publish them on another interface.
  # ---------------------------------------------------------------------------
  migrate:
    build: *app-build
    image: rootcause-app:dev
    # One-shot: compose must not restart it after a successful upgrade.
    restart: "no"
    command: ["rootcause-db", "upgrade"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: *app-env-file
    environment:
      <<: [*app-environment, *app-env-scrub]
      # The only service that gets the migrator URL (DDL rights).
      ROOTCAUSE_MIGRATION_DATABASE_URL: postgresql://rootcause_migrator:${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-rootcause}

  # One-shot after migrate: creates the LangGraph checkpointer/store tables in
  # the app schema as the owner role (the app role cannot run DDL).
  agent-setup:
    build: *app-build
    image: rootcause-app:dev
    restart: "no"
    command: ["python", "-m", "rootcause.agent_service.persistence"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: *app-env-file
    environment:
      <<: [*app-environment, *app-env-scrub]
      ROOTCAUSE_MIGRATION_DATABASE_URL: postgresql://rootcause_migrator:${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-rootcause}

  api:
    build: *app-build
    image: rootcause-app:dev
    restart: unless-stopped
    command: ["uvicorn", "--factory", "rootcause.api.main:create_app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on: *app-depends-on
    env_file: *app-env-file
    environment:
      <<: [*app-environment, *app-env-scrub]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes: *app-data-volume
    healthcheck:
      # The slim image has no curl; GET /health answers 200 even when a
      # dependency is degraded (the body carries the detail).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  agent:
    build: *app-build
    image: rootcause-app:dev
    restart: unless-stopped
    command: ["uvicorn", "--factory", "rootcause.agent_service.main:create_app", "--host", "0.0.0.0", "--port", "8100"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      agent-setup:
        condition: service_completed_successfully
    env_file: *app-env-file
    environment:
      <<: [*app-environment, *app-env-scrub]
    ports:
      - "127.0.0.1:${AGENT_PORT:-8100}:8100"
    volumes: *app-data-volume
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are inlined into the browser bundle at build time, so
      # they are build args: change them and rebuild (`up --build`). They are
      # the URLs the BROWSER uses, i.e. the host-published api/agent ports.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AGENT_URL: ${NEXT_PUBLIC_AGENT_URL:-http://localhost:8100}
    image: rootcause-web:dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      agent:
        condition: service_started
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  openviking_data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_minio_data:
