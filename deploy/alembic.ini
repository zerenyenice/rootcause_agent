# Alembic configuration for the application database.
# The database URL comes from ROOTCAUSE_DATABASE_URL (see the Settings docs),
# never from this file. Prefer the `rootcause-db` CLI; this file lets plain
# `alembic -c deploy/alembic.ini ...` work from the repository root.
[alembic]
script_location = %(here)s/../packages/db/src/rootcause_db/alembic
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
