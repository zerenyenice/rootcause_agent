# DEV-ONLY Alembic configuration for the application database.
# Use the `rootcause-db` CLI everywhere else: plain `alembic` skips its prod
# guards (downgrade/revision refusal) and its one-line, URL-free errors.
# This file only lets `alembic -c deploy/alembic.ini ...` work from the
# repository root during development. The URL comes from
# ROOTCAUSE_MIGRATION_DATABASE_URL (the migrator role), never from this file.
[alembic]
script_location = %(here)s/../src/rootcause/db/alembic
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
