[project]
name = "rootcause-core"
version = "0.1.0"
description = "RootCause shared core: settings, logging and base types."
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
    "structlog>=24",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "httpx>=0.27",
    # Exact pin: the client patches two private SDK internals
    # (CallbackHandler._get_error_level_and_status_message and
    # langfuse._client.propagation._detach_context_token_safely); bump deliberately
    # and re-run test_langfuse_pii_hardening.py, which checks both still exist.
    "langfuse==5.0.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootcause_core"]
