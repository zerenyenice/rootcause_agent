[project]
name = "rootcause-core"
version = "0.1.0"
description = "RootCause shared core: settings, logging and base types."
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
    "structlog>=24",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
]

[project.scripts]
rootcause-db = "rootcause_core.db.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootcause_core"]
