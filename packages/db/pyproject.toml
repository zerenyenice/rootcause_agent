[project]
name = "rootcause-db"
version = "0.1.0"
description = "RootCause application database: Alembic migrations, bootstrap and the rootcause-db CLI."
requires-python = ">=3.12"
dependencies = [
    "rootcause-core",
    "rootcause-connections",
    "rootcause-catalog",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
rootcause-db = "rootcause_db.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootcause_db"]

[tool.uv.sources]
rootcause-core = { workspace = true }
rootcause-connections = { workspace = true }
rootcause-catalog = { workspace = true }
