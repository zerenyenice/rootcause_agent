[project]
name = "rootcause-evals"
version = "0.1.0"
description = "RootCause evaluation harness."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "pandas>=3.0",
    "duckdb>=1.1",
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootcause_evals"]
