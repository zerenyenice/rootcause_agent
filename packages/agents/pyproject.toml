[project]
name = "rootcause-agents"
version = "0.1.0"
description = "RootCause agent definitions and orchestration."
requires-python = ">=3.12"
dependencies = [
    "rootcause-core",
    "deepagents>=0.7",
    "langchain>=1.0",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "langchain-anthropic>=0.3",
]

[tool.uv.sources]
rootcause-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootcause_agents"]
