name: CI

# This repo is both the agent-harness template and the RootCause Python
# monorepo (a uv workspace: apps/api + packages/*, with ruff/mypy/pytest
# configured in pyproject.toml). CI therefore has two concerns:
#   1. Product quality — `python-quality` mirrors the local lint → format →
#      typecheck → test commands and fails under 80% coverage (the Gate 2
#      bar); `dependency-audit` checks locked runtime deps for known CVEs.
#   2. Harness integrity — generated surfaces must match their sources,
#      shell/JSON config must parse and lint clean, and every commit must
#      carry this project's git-protocol trailers.
#   3. Deploy config — `compose-config` keeps deploy/docker-compose.yml
#      parsing and interpolating against the committed placeholder env.
# See docs/CI.md for the full rationale and local repro commands for each
# job below.

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Core check: .claude/agents/, .github/agents/, .github/copilot-instructions.md,
  # AGENTS.md, .github/prompts/, .github/instructions/ are all GENERATED from
  # CLAUDE.md / .agents_base/ / .claude/{commands,rules} by setup-harness.py.
  # If a generated surface was hand-edited (or a source changed and the
  # generator wasn't re-run), regenerating produces a diff — that diff is the
  # failure signal.
  harness-sync:
    name: harness-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The base template ships Claude-only surfaces (.claude/); Copilot
      # surfaces (.github/agents, prompts, instructions, AGENTS.md,
      # copilot-instructions.md) are generated per project when a team picks
      # a vscode/pycharm/all target. Project copies that switch targets
      # should update this line to match their committed state.
      - name: Regenerate harness surfaces from sources
        run: python3 setup-harness.py --target claude

      - name: Fail on drift between sources and generated surfaces
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated harness surfaces are out of sync with their sources."
            echo "A generated file was hand-edited, or a source changed without" \
                 "re-running the generator. Fix locally with:"
            echo "    python3 setup-harness.py --target claude   # or your project's target"
            echo "then commit the sources AND the regenerated files together."
            echo ""
            echo "Drifted paths (modified + and/or untracked ?? ):"
            git status --porcelain
            exit 1
          fi
          echo "Generated harness surfaces match their sources."

  # setup-harness.py is the one piece of executable logic in this repo; the
  # shell scripts under .claude/scripts and .claude/skills are the rest.
  lint-shell:
    name: lint-shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck all tracked shell scripts
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No tracked shell scripts; nothing to check."
            exit 0
          fi
          echo "Checking:"
          printf '  %s\n' "${files[@]}"
          # (ShellCheck itself is preinstalled on ubuntu-latest runners.)
          shellcheck "${files[@]}"

  # actionlint catches schema errors, unknown contexts, and shell-injection
  # patterns in run: blocks that a YAML parser alone would miss. The binary
  # is downloaded from the project's GitHub Releases and checksum-verified
  # rather than trusted from a third-party wrapper action.
  lint-workflows:
    name: lint-workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and checksum-verify actionlint
        run: |
          set -euo pipefail
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$asset" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${asset}"
          echo "${ACTIONLINT_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" actionlint
          ./actionlint -version

      - name: Run actionlint
        run: ./actionlint -color .github/workflows/*.yml

  # Every tracked .json file must parse — .mcp.json, .claude/mcp-configs/*,
  # and any settings files a contributor might add.
  validate-json:
    name: validate-json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse every tracked JSON file
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.json')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No tracked JSON files; nothing to check."
            exit 0
          fi
          failed=0
          for f in "${files[@]}"; do
            if python3 -m json.tool "$f" > /dev/null; then
              echo "OK   $f"
            else
              echo "::error::Invalid JSON: $f"
              failed=1
            fi
          done
          exit "$failed"

  # deploy/docker-compose.yml (T002) must always parse, satisfy the compose
  # schema and interpolate every ${VAR} against the committed placeholder
  # env file, so a broken stack definition fails here and not on a
  # developer's first `up`. `config -q` resolves the file without pulling
  # images or starting containers (docker compose is preinstalled on
  # ubuntu-latest), so the job is cheap and needs no secrets. The second
  # step performs the same ${VAR} expansion OpenViking applies to its
  # config template at load time and checks the result is valid JSON.
  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deploy/docker-compose.yml against deploy/.env.example
        run: |
          set -euo pipefail
          docker compose version
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q
          echo "deploy/docker-compose.yml parses and interpolates cleanly."

      - name: Check deploy/openviking/ov.conf expands to valid JSON
        run: |
          set -euo pipefail
          # Export the placeholder env exactly as compose would hand it to the
          # container, then expand the template the way the server does
          # (os.path.expandvars + json.loads).
          set -a
          # shellcheck disable=SC1091
          . deploy/.env.example
          set +a
          : "${OPENVIKING_VLM_PROVIDER:=$OPENVIKING_EMBEDDING_PROVIDER}"
          : "${OPENVIKING_VLM_API_BASE:=$OPENVIKING_EMBEDDING_API_BASE}"
          : "${OPENVIKING_VLM_API_KEY:=$OPENVIKING_EMBEDDING_API_KEY}"
          export OPENVIKING_VLM_PROVIDER OPENVIKING_VLM_API_BASE OPENVIKING_VLM_API_KEY
          python3 - <<'PYCHECK'
          import json, os, pathlib, sys
          raw = pathlib.Path("deploy/openviking/ov.conf").read_text(encoding="utf-8")
          expanded = os.path.expandvars(raw)
          if "${" in expanded:
              sys.exit("::error::unexpanded ${VAR} left in deploy/openviking/ov.conf")
          conf = json.loads(expanded)
          for key in ("server", "storage", "embedding", "vlm"):
              if key not in conf:
                  sys.exit(f"::error::deploy/openviking/ov.conf is missing the '{key}' section")
          if not isinstance(conf["embedding"]["dense"]["dimension"], int):
              sys.exit("::error::embedding.dense.dimension must expand to a JSON integer")
          print("deploy/openviking/ov.conf expands to valid JSON with all required sections.")
          PYCHECK

  # This repo's git protocol (rules/common/git-workflow.md) requires every
  # commit to carry a conventional-commit type prefix plus Agent:/Task:
  # trailers, so history alone is a reconstructable audit trail. This job is
  # the machine-enforced version of that check for PR ranges.
  commit-protocol:
    name: commit-protocol
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Validate conventional type + Agent:/Task: trailers on every non-merge commit"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          mapfile -t commits < <(git rev-list --no-merges "${merge_base}..${HEAD_SHA}")

          if [ "${#commits[@]}" -eq 0 ]; then
            echo "No non-merge commits in range ${merge_base}..${HEAD_SHA}; nothing to check."
            exit 0
          fi

          type_re='^(feat|fix|refactor|docs|test|chore|perf|ci)(\([a-zA-Z0-9_./-]+\))?: .+'
          overall=0

          for sha in "${commits[@]}"; do
            subject=$(git show -s --format=%s "$sha")
            body=$(git show -s --format=%B "$sha")
            commit_failed=0

            if ! printf '%s\n' "$subject" | grep -Eq "$type_re"; then
              echo "::error::commit $sha missing conventional type prefix (feat|fix|refactor|docs|test|chore|perf|ci): $subject"
              commit_failed=1
            fi
            if ! printf '%s\n' "$body" | grep -Eq '^Agent: .+'; then
              echo "::error::commit $sha missing 'Agent:' trailer: $subject"
              commit_failed=1
            fi
            if ! printf '%s\n' "$body" | grep -Eq '^Task: .+'; then
              echo "::error::commit $sha missing 'Task:' trailer: $subject"
              commit_failed=1
            fi

            if [ "$commit_failed" -eq 1 ]; then
              overall=1
            fi
          done

          if [ "$overall" -eq 1 ]; then
            echo "One or more commits violate the commit protocol (rules/common/git-workflow.md)."
            exit 1
          fi
          echo "All ${#commits[@]} commit(s) in range satisfy the commit protocol."

  # Product quality gate, mirroring the local commands from pyproject.toml in
  # fail-fast order: lint → format → typecheck → tests with coverage. The
  # --cov-fail-under value MUST stay at the 80% from rules/common/testing.md;
  # lowering it (or adding continue-on-error / deleting a step) is a Gate 2
  # override only the user can grant.
  python-quality:
    name: python-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv itself is version-pinned so the runner resolves/installs exactly
      # like a developer's machine; bump deliberately via a `ci:` commit.
      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync workspace from uv.lock (fails if lockfile is stale)
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Typecheck with mypy (strict)
        run: uv run mypy

      - name: Run tests with coverage (fail under 80%)
        run: uv run pytest -q --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage.xml (7-day retention)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  # Supply-chain gate (rules/devops/security.md): export the locked *runtime*
  # dependency set of every workspace member — dev tooling (--no-dev) and the
  # first-party members themselves (--no-emit-workspace) excluded — and audit
  # it against the PyPI advisory DB. Any known vulnerability fails the job;
  # --strict also fails if a dependency cannot be resolved for auditing
  # instead of silently skipping it.
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PIP_AUDIT_VERSION: "2.10.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cache-suffix keeps this job's cache key distinct from python-quality's
      # (same uv.lock glob) so the two jobs don't race to save one key.
      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: audit

      - name: Export locked runtime dependencies to requirements-audit.txt
        run: |
          set -euo pipefail
          uv export --locked --no-dev --no-emit-workspace \
            --format requirements.txt -o requirements-audit.txt
          # While the workspace has no third-party runtime deps the export is
          # comment-only. pip-audit accepts that (exit 0, "No known
          # vulnerabilities found" — verified locally), so nothing is
          # special-cased here; the notice just keeps the empty set visible.
          if ! grep -qvE '^[[:space:]]*(#|$)' requirements-audit.txt; then
            echo "::notice::No third-party runtime dependencies in uv.lock; the audit set is empty."
          fi

      - name: Audit runtime dependencies with pip-audit
        run: >
          uv tool run "pip-audit@${PIP_AUDIT_VERSION}"
          -r requirements-audit.txt --strict --progress-spinner off
