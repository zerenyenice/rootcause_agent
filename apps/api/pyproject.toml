[project]
name = "rootcause-api"
version = "0.1.0"
description = "RootCause API service (FastAPI app beside LangGraph Server)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "limits>=3.13,<6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "langgraph>=0.4",
    "rootcause-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootcause_api"]
